<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--card:#171b21;--line:#262c35;--text:#f2f4f7;--muted:#9aa3af;--accent:#c6f432;--ink:#0b0d10}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:48px 18px 40px;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:-220px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,rgba(198,244,50,.16),transparent 65%);pointer-events:none}
main{width:100%;max-width:460px;position:relative}
.head{text-align:center;margin-bottom:30px}
.avatar{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;background:var(--card);border:2px solid var(--accent);display:grid;place-items:center;font-size:40px;font-weight:900;color:var(--accent)}
h1{font-size:26px;font-weight:900}
h1 span{color:var(--accent)}
.bio{color:var(--muted);margin-top:6px;font-size:16px;line-height:1.7}
.links{display:grid;gap:12px}
a.l{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:15px 18px;color:var(--text);text-decoration:none;font-weight:700;font-size:17px;transition:transform .15s,border-color .15s}
a.l:hover,a.l:active{transform:translateY(-2px);border-color:var(--accent)}
a.l .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
a.l .ic svg{width:22px;height:22px}
a.l .t{flex:1}
a.l .t small{display:block;color:var(--muted);font-weight:500;font-size:13.5px;direction:ltr;text-align:right}
a.l .arr{color:var(--muted);font-size:20px}
a.main{background:var(--accent);color:var(--ink);border-color:var(--accent);padding:18px}
a.main .ic{background:rgba(11,13,16,.12)}
a.main .t small{color:rgba(11,13,16,.7);direction:rtl}
a.main .arr{color:var(--ink)}
.ig{background:linear-gradient(45deg,#f9a825,#e91e63,#8e24aa)}
.tt{background:#000;border:1px solid #333}
.sc{background:#fffc00}
.wa{background:#25d366}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
